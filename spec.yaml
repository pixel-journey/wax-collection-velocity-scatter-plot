blueprint:
  id: wax-collection-velocity-scatter-plot
  name: Collection Velocity Scatter Plot
  tier: market-analytics
  category: analytics
  status: refined
  version: "0.5.0"
  last_refined: "2026-10-18"

metadata:
  description: |
    Pure hold-duration vs trade-velocity quadrant classification with soft
    wash-suspect flags and SVG scatter. Educational market analytics.

invariants:
  - Classification pure given points + thresholds
  - Demo data deterministic
  - Wash labels heuristic only

features:
  implemented:
    - classifyPoint, classifyCollection
    - VelocityScatterSvg, counts, flags, demo
    - app page wired to engines

machine_instructions:
  - Use examples/engines.ts — no Math.random for analysis points
  - Map AtomicMarket sales into holdDays and velocityPer30d at app edge

technical_requirements:
  framework: Next.js + TypeScript
  styling: Tailwind CSS
